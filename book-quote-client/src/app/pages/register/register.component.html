<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-3"><i class="fa-solid fa-user-plus me-2"></i>Registrera</h1>
          @if (error()) {
            <div class="alert alert-danger" role="alert">{{ error() }}</div>
          }
          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="mb-3">
              <label class="form-label" for="userName">Användarnamn</label>
              <input id="userName" type="text" class="form-control" formControlName="userName" autocomplete="username" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="email">E-post</label>
              <input id="email" type="email" class="form-control" formControlName="email" autocomplete="email" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Lösenord</label>
              <input id="password" type="password" class="form-control" formControlName="password" autocomplete="new-password" />
            </div>
            <button class="btn btn-primary w-100" type="submit" [disabled]="loading()">
              @if (loading()) {
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
              }
              Skapa konto
            </button>
          </form>
          <p class="mt-3 mb-0 text-center small">
            Har du redan konto?
            <a routerLink="/login">Logga in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
